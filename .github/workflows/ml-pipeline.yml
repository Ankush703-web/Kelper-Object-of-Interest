name: Kepler ML Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  train-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load and validate dataset
        run: |
          python -m src.data

      - name: Train model and enforce quality gate
        run: |
          python -m src.train --dataset build/kepler_koi.csv --mode normal

      - name: Run application tests
  	env:
   	 PYTHONPATH: ${{ github.workspace }}
  	run: |
   	 pytest -q

      - name: Prepare validated model package
        run: |
          mkdir -p package
          cp build/kepler_model.joblib package/
          cp build/metrics.json package/
          cp src/predict.py package/
          cp requirements.txt package/
          cp README.md package/

          echo "Workflow run: $GITHUB_RUN_NUMBER" > package/PACKAGE_INFO.txt
          echo "Commit: $GITHUB_SHA" >> package/PACKAGE_INFO.txt
          echo "Validated package generated only after training, gate, and tests passed." >> package/PACKAGE_INFO.txt

          cd package
          zip -r "../kepler-model-package-${GITHUB_RUN_NUMBER}.zip" .
          cd ..
          mkdir -p build
          mv "kepler-model-package-${GITHUB_RUN_NUMBER}.zip" build/

      - name: Publish validated model package
        uses: actions/upload-artifact@v4
        with:
          name: kepler-model-package-${{ github.run_number }}
          path: build/kepler-model-package-${{ github.run_number }}.zip
          if-no-files-found: error
          retention-days: 7
